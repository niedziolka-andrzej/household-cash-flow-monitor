<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cash Flow Monitor</title>
    <!-- Relative on purpose: Vite hashes this into dist/assets/, the one directory
         electrobun.config.ts copies into the bundle. A `/`-rooted or public/ path would
         resolve in dev and 404 in the packaged app. Regenerate with `bun run icons`. -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- Typefaces from the design comp. Remote, so an offline launch falls back to the
         system sans declared in tailwind.config.js rather than blocking render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
