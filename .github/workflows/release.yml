name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases so two pushes can never claim the same YYYY.MM.DD.N tag.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag list to compute the daily increment

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute release version
        id: version
        run: |
          $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById('Central European Standard Time')
          $now = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
          $base = $now.ToString('yyyy.MM.dd')

          $existing = @(git tag --list $base "$base.*")
          if ($existing.Count -eq 0) {
            $version = $base
          } else {
            $max = 0
            $escaped = [regex]::Escape($base)
            foreach ($tag in $existing) {
              if ($tag -match "^$escaped\.(\d+)$") {
                $n = [int]$Matches[1]
                if ($n -gt $max) { $max = $n }
              }
            }
            $version = "$base.$($max + 1)"
          }

          Write-Host "Release version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stamp version into app config
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $path = 'electrobun.config.ts'
          $content = Get-Content $path -Raw
          $rx = [regex]'version:\s*"[^"]*"'
          if (-not $rx.IsMatch($content)) { throw "No version field found in $path" }
          $rx.Replace($content, "version: `"$version`"", 1) | Set-Content -Path $path -NoNewline -Encoding utf8

      - name: Build (production)
        run: bun run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $files = @(Get-ChildItem -Path artifacts -File)
          if ($files.Count -eq 0) { throw "No build artifacts produced in artifacts/" }
          $files | ForEach-Object { Write-Host "asset: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

          $assets = $files | ForEach-Object { $_.FullName }
          gh release create $version $assets `
            --target $env:GITHUB_SHA `
            --title $version `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
